      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .grid-liens {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      padding: 20px;
      width: 90%;
      max-width: 1200px;
    }

    .grid-liens a img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      transition: transform 0.2s;
    }

    .grid-liens a img:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      .grid-liens {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .grid-liens {
        grid-template-columns: 1fr;

    }
